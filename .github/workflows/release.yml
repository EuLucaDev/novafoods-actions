      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out novafoods-fonts
        if: inputs.novafoods-fonts-ref != ''
        uses: EuLucaDev/novafoods-actions/actions/checkout-novafoods-fonts@main
        with:
          ref: ${{ inputs.novafoods-fonts-ref }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-riscv64
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION"
      - uses: EuLucaDev/novafoods-actions/actions/install-riscv64-cross@main
      - name: Install nfpm (SHA256-verified)
        uses: EuLucaDev/novafoods-actions/actions/install-nfpm@main
        with:
          nfpm-version: ${{ inputs.nfpm-version }}
          deb-arch: amd64
      - name: Build and package (deb, rpm, tar.gz)
        env:
          NOVAFOODS_FONTS_DIR: ${{ github.workspace }}/novafoods-fonts
          NOVAFOODS_FONTS_REQUIRED: "1"
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /
          PKG_CONFIG_PATH: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CROSS_ARCH: riscv64
          CROSS_TARGET: riscv64gc-unknown-linux-gnu
          CROSS_COMPILE: riscv64-linux-gnu-
          EMULATOR: qemu-riscv64
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
        run: packaging/linux/package.sh --formats "deb rpm tar"
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*-linux-riscv64.deb 2>/dev/null || true
          dpkg-deb --contents dist/release/*-linux-riscv64.deb 2>/dev/null | grep -E 'usr/bin/|metainfo|applications' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-riscv64
          path: dist/release/*
          if-no-files-found: error

