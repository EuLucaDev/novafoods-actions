name: "Release"

on:
  workflow_call:
    inputs:
      app-name:
        description: "Application repository name (e.g. novaphoto, novacad)"
        type: string
        required: true
      app-title:
        description: "Application display name (e.g. NovaPhoto, NovaCad)"
        type: string
        required: true
      novafoods-fonts-ref:
        description: "Git ref for EuLucaDev/novafoods-fonts embedded font assets (optional)"
        type: string
        required: false
        default: ""
      version:
        description: "Version override for a test run (empty: read from Cargo.toml)"
        type: string
        required: false
        default: ""
      has-web:
        description: "Whether to build the WebAssembly (wasm) release"
        type: boolean
        required: false
        default: false
      has-riscv64:
        description: "Whether to build the Linux riscv64 release"
        type: boolean
        required: false
        default: false
      has-freebsd:
        description: "Whether to build the FreeBSD release"
        type: boolean
        required: false
        default: false
      wix-version:
        description: "Version of WiX tool to install"
        type: string
        required: false
        default: "5.0.2"
      nfpm-version:
        description: "Version of nfpm tool to install"
        type: string
        required: false
        default: "2.47.0"
      trunk-version:
        description: "Version of trunk tool to install"
        type: string
        required: false
        default: "0.21.14"
      freebsd-release:
        description: "FreeBSD OS version to run in VM"
        type: string
        required: false
        default: "15.1-STABLE"

    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_CERT_PROFILE:
        required: false

permissions:
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Resolve version
        uses: EuLucaDev/novafoods-actions/actions/resolve-version@main
        with:
          input-version: ${{ inputs.version }}
          app-title: ${{ inputs.app-title }}

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15-xlarge
    environment: release
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVACAD_VERSION: ${{ needs.version.outputs.version }}
      NOVACAD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVACAD_BUILD_SHA: ${{ github.sha }}
      NOVAFOODS_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      NOVAFOODS_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFOODS_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      NOVADECK_VERSION: ${{ needs.version.outputs.version }}
      NOVADECK_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADECK_BUILD_SHA: ${{ github.sha }}
      NOVADESIGN_VERSION: ${{ needs.version.outputs.version }}
      NOVADESIGN_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADESIGN_BUILD_SHA: ${{ github.sha }}
      NOVAEFFECT_VERSION: ${{ needs.version.outputs.version }}
      NOVAEFFECT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAEFFECT_BUILD_SHA: ${{ github.sha }}
      NOVAFILM_VERSION: ${{ needs.version.outputs.version }}
      NOVAFILM_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFILM_BUILD_SHA: ${{ github.sha }}
      NOVAGRID_VERSION: ${{ needs.version.outputs.version }}
      NOVAGRID_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAGRID_BUILD_SHA: ${{ github.sha }}
      NOVALIGHT_VERSION: ${{ needs.version.outputs.version }}
      NOVALIGHT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVALIGHT_BUILD_SHA: ${{ github.sha }}
      NOVAPDF_VERSION: ${{ needs.version.outputs.version }}
      NOVAPDF_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPDF_BUILD_SHA: ${{ github.sha }}
      NOVAPHOTO_VERSION: ${{ needs.version.outputs.version }}
      NOVAPHOTO_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPHOTO_BUILD_SHA: ${{ github.sha }}
      NOVASOUND_VERSION: ${{ needs.version.outputs.version }}
      NOVASOUND_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVASOUND_BUILD_SHA: ${{ github.sha }}
      NOVAVECTOR_VERSION: ${{ needs.version.outputs.version }}
      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out novafoods-fonts
        if: inputs.novafoods-fonts-ref != ''
        uses: EuLucaDev/novafoods-actions/actions/checkout-novafoods-fonts@main
        with:
          ref: ${{ inputs.novafoods-fonts-ref }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos-universal
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION"
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOVAFOODS_FONTS_DIR: ${{ github.workspace }}/novafoods-fonts
          NOVAFOODS_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - name: Verify signatures and notarization
        if: hashFiles('packaging/macos/verify.sh') != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/verify.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVACAD_VERSION: ${{ needs.version.outputs.version }}
      NOVACAD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVACAD_BUILD_SHA: ${{ github.sha }}
      NOVAFOODS_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      NOVAFOODS_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFOODS_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      NOVADECK_VERSION: ${{ needs.version.outputs.version }}
      NOVADECK_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADECK_BUILD_SHA: ${{ github.sha }}
      NOVADESIGN_VERSION: ${{ needs.version.outputs.version }}
      NOVADESIGN_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADESIGN_BUILD_SHA: ${{ github.sha }}
      NOVAEFFECT_VERSION: ${{ needs.version.outputs.version }}
      NOVAEFFECT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAEFFECT_BUILD_SHA: ${{ github.sha }}
      NOVAFILM_VERSION: ${{ needs.version.outputs.version }}
      NOVAFILM_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFILM_BUILD_SHA: ${{ github.sha }}
      NOVAGRID_VERSION: ${{ needs.version.outputs.version }}
      NOVAGRID_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAGRID_BUILD_SHA: ${{ github.sha }}
      NOVALIGHT_VERSION: ${{ needs.version.outputs.version }}
      NOVALIGHT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVALIGHT_BUILD_SHA: ${{ github.sha }}
      NOVAPDF_VERSION: ${{ needs.version.outputs.version }}
      NOVAPDF_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPDF_BUILD_SHA: ${{ github.sha }}
      NOVAPHOTO_VERSION: ${{ needs.version.outputs.version }}
      NOVAPHOTO_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPHOTO_BUILD_SHA: ${{ github.sha }}
      NOVASOUND_VERSION: ${{ needs.version.outputs.version }}
      NOVASOUND_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVASOUND_BUILD_SHA: ${{ github.sha }}
      NOVAVECTOR_VERSION: ${{ needs.version.outputs.version }}
      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      # See the macOS job: unlisted secrets are empty, and the build would ship unsigned.
      # Signing needs either the PFX pair or all six Azure Trusted Signing values.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out novafoods-fonts
        if: inputs.novafoods-fonts-ref != ''
        uses: EuLucaDev/novafoods-actions/actions/checkout-novafoods-fonts@main
        with:
          ref: ${{ inputs.novafoods-fonts-ref }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$VERSION"
      - name: Install WiX
        uses: EuLucaDev/novafoods-actions/actions/install-wix@main
        with:
          wix-version: ${{ inputs.wix-version }}
      - name: Build, sign, package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          NOVAFOODS_FONTS_DIR: ${{ github.workspace }}/novafoods-fonts
          NOVAFOODS_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVACAD_VERSION: ${{ needs.version.outputs.version }}
      NOVACAD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVACAD_BUILD_SHA: ${{ github.sha }}
      NOVAFOODS_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      NOVAFOODS_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFOODS_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      NOVADECK_VERSION: ${{ needs.version.outputs.version }}
      NOVADECK_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADECK_BUILD_SHA: ${{ github.sha }}
      NOVADESIGN_VERSION: ${{ needs.version.outputs.version }}
      NOVADESIGN_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADESIGN_BUILD_SHA: ${{ github.sha }}
      NOVAEFFECT_VERSION: ${{ needs.version.outputs.version }}
      NOVAEFFECT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAEFFECT_BUILD_SHA: ${{ github.sha }}
      NOVAFILM_VERSION: ${{ needs.version.outputs.version }}
      NOVAFILM_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFILM_BUILD_SHA: ${{ github.sha }}
      NOVAGRID_VERSION: ${{ needs.version.outputs.version }}
      NOVAGRID_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAGRID_BUILD_SHA: ${{ github.sha }}
      NOVALIGHT_VERSION: ${{ needs.version.outputs.version }}
      NOVALIGHT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVALIGHT_BUILD_SHA: ${{ github.sha }}
      NOVAPDF_VERSION: ${{ needs.version.outputs.version }}
      NOVAPDF_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPDF_BUILD_SHA: ${{ github.sha }}
      NOVAPHOTO_VERSION: ${{ needs.version.outputs.version }}
      NOVAPHOTO_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPHOTO_BUILD_SHA: ${{ github.sha }}
      NOVASOUND_VERSION: ${{ needs.version.outputs.version }}
      NOVASOUND_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVASOUND_BUILD_SHA: ${{ github.sha }}
      NOVAVECTOR_VERSION: ${{ needs.version.outputs.version }}
      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out novafoods-fonts
        if: inputs.novafoods-fonts-ref != ''
        uses: EuLucaDev/novafoods-actions/actions/checkout-novafoods-fonts@main
        with:
          ref: ${{ inputs.novafoods-fonts-ref }}
      - uses: EuLucaDev/novafoods-actions/actions/install-linux-deps@main
        with:
          deb-arch: ${{ matrix.deb }}
          nfpm-version: ${{ inputs.nfpm-version }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          NOVAFOODS_FONTS_DIR: ${{ github.workspace }}/novafoods-fonts
          NOVAFOODS_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb || true
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/|metainfo|applications' || true
          for appimage in dist/release/*.AppImage; do
            if [ -f "$appimage" ]; then
              chmod +x "$appimage"
              APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || true
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [version, linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVACAD_VERSION: ${{ needs.version.outputs.version }}
      NOVACAD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVACAD_BUILD_SHA: ${{ github.sha }}
      NOVAFOODS_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      NOVAFOODS_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFOODS_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      NOVADECK_VERSION: ${{ needs.version.outputs.version }}
      NOVADECK_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADECK_BUILD_SHA: ${{ github.sha }}
      NOVADESIGN_VERSION: ${{ needs.version.outputs.version }}
      NOVADESIGN_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADESIGN_BUILD_SHA: ${{ github.sha }}
      NOVAEFFECT_VERSION: ${{ needs.version.outputs.version }}
      NOVAEFFECT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAEFFECT_BUILD_SHA: ${{ github.sha }}
      NOVAFILM_VERSION: ${{ needs.version.outputs.version }}
      NOVAFILM_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFILM_BUILD_SHA: ${{ github.sha }}
      NOVAGRID_VERSION: ${{ needs.version.outputs.version }}
      NOVAGRID_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAGRID_BUILD_SHA: ${{ github.sha }}
      NOVALIGHT_VERSION: ${{ needs.version.outputs.version }}
      NOVALIGHT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVALIGHT_BUILD_SHA: ${{ github.sha }}
      NOVAPDF_VERSION: ${{ needs.version.outputs.version }}
      NOVAPDF_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPDF_BUILD_SHA: ${{ github.sha }}
      NOVAPHOTO_VERSION: ${{ needs.version.outputs.version }}
      NOVAPHOTO_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPHOTO_BUILD_SHA: ${{ github.sha }}
      NOVASOUND_VERSION: ${{ needs.version.outputs.version }}
      NOVASOUND_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVASOUND_BUILD_SHA: ${{ github.sha }}
      NOVAVECTOR_VERSION: ${{ needs.version.outputs.version }}
      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        run: |
          tarball=$(ls dist/linux/*-linux-${{ matrix.arch }}.tar.gz 2>/dev/null | head -n 1)
          packaging/linux/flatpak-bundle.sh "$tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error

  freebsd:
    name: FreeBSD x86_64
    if: inputs.has-freebsd
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVACAD_VERSION: ${{ needs.version.outputs.version }}
      NOVACAD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVACAD_BUILD_SHA: ${{ github.sha }}
      NOVAFOODS_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      NOVAFOODS_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFOODS_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      NOVADECK_VERSION: ${{ needs.version.outputs.version }}
      NOVADECK_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADECK_BUILD_SHA: ${{ github.sha }}
      NOVADESIGN_VERSION: ${{ needs.version.outputs.version }}
      NOVADESIGN_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADESIGN_BUILD_SHA: ${{ github.sha }}
      NOVAEFFECT_VERSION: ${{ needs.version.outputs.version }}
      NOVAEFFECT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAEFFECT_BUILD_SHA: ${{ github.sha }}
      NOVAFILM_VERSION: ${{ needs.version.outputs.version }}
      NOVAFILM_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFILM_BUILD_SHA: ${{ github.sha }}
      NOVAGRID_VERSION: ${{ needs.version.outputs.version }}
      NOVAGRID_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAGRID_BUILD_SHA: ${{ github.sha }}
      NOVALIGHT_VERSION: ${{ needs.version.outputs.version }}
      NOVALIGHT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVALIGHT_BUILD_SHA: ${{ github.sha }}
      NOVAPDF_VERSION: ${{ needs.version.outputs.version }}
      NOVAPDF_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPDF_BUILD_SHA: ${{ github.sha }}
      NOVAPHOTO_VERSION: ${{ needs.version.outputs.version }}
      NOVAPHOTO_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPHOTO_BUILD_SHA: ${{ github.sha }}
      NOVASOUND_VERSION: ${{ needs.version.outputs.version }}
      NOVASOUND_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVASOUND_BUILD_SHA: ${{ github.sha }}
      NOVAVECTOR_VERSION: ${{ needs.version.outputs.version }}
      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out novafoods-fonts
        if: inputs.novafoods-fonts-ref != ''
        uses: EuLucaDev/novafoods-actions/actions/checkout-novafoods-fonts@main
        with:
          ref: ${{ inputs.novafoods-fonts-ref }}
      - name: Build and package in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: ${{ inputs.freebsd-release == '15.1-STABLE' && '15.1' || inputs.freebsd-release }}
          usesh: true
          cpu: 4
          mem: 12288
          envs: "VERSION BUILD_DATE BUILD_SHA INPUT_VERSION NOVACAD_VERSION NOVACAD_BUILD_DATE NOVACAD_BUILD_SHA NOVAFOODS_LAUNCHER_VERSION NOVAFOODS_LAUNCHER_BUILD_DATE NOVAFOODS_LAUNCHER_BUILD_SHA NOVADECK_VERSION NOVADECK_BUILD_DATE NOVADECK_BUILD_SHA NOVADESIGN_VERSION NOVADESIGN_BUILD_DATE NOVADESIGN_BUILD_SHA NOVAEFFECT_VERSION NOVAEFFECT_BUILD_DATE NOVAEFFECT_BUILD_SHA NOVAFILM_VERSION NOVAFILM_BUILD_DATE NOVAFILM_BUILD_SHA NOVAGRID_VERSION NOVAGRID_BUILD_DATE NOVAGRID_BUILD_SHA NOVALIGHT_VERSION NOVALIGHT_BUILD_DATE NOVALIGHT_BUILD_SHA NOVAPDF_VERSION NOVAPDF_BUILD_DATE NOVAPDF_BUILD_SHA NOVAPHOTO_VERSION NOVAPHOTO_BUILD_DATE NOVAPHOTO_BUILD_SHA NOVASOUND_VERSION NOVASOUND_BUILD_DATE NOVASOUND_BUILD_SHA NOVAVECTOR_VERSION NOVAVECTOR_BUILD_DATE NOVAVECTOR_BUILD_SHA NOVAWORD_VERSION NOVAWORD_BUILD_DATE NOVAWORD_BUILD_SHA"
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -e
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "*"
            export CARGO_TARGET_DIR=/var/tmp/craft-target CARGO_BUILD_JOBS=4
            if [ -n "$INPUT_VERSION" ]; then cargo xtask version set "$VERSION" || cargo run -q -p xtask -- version set "$VERSION"; fi
            export NOVAFOODS_FONTS_DIR="$PWD/novafoods-fonts" NOVAFOODS_FONTS_REQUIRED=1
            if [ -f packaging/freebsd/package.sh ]; then
              bash packaging/freebsd/package.sh
            else
              cargo build --release --locked -p ${{ inputs.app-name }} $(cargo metadata --format-version 1 --no-deps | grep -q '"${{ inputs.app-name }}-cli"' && echo "-p ${{ inputs.app-name }}-cli" || true)
              name="${{ inputs.app-name }}-$VERSION-freebsd-x86_64"
              mkdir -p "dist/release/$name"
              cp target/release/${{ inputs.app-name }} "dist/release/$name/" 2>/dev/null || cp /var/tmp/craft-target/release/${{ inputs.app-name }} "dist/release/$name/"
              if [ -f target/release/${{ inputs.app-name }}-cli ]; then
                cp target/release/${{ inputs.app-name }}-cli "dist/release/$name/"
              elif [ -f /var/tmp/craft-target/release/${{ inputs.app-name }}-cli ]; then
                cp /var/tmp/craft-target/release/${{ inputs.app-name }}-cli "dist/release/$name/"
              fi
              cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "dist/release/$name/" 2>/dev/null || true
              if [ -f packaging/linux/br.com.novafoods.${{ inputs.app-name }}.desktop ]; then
                cp packaging/linux/br.com.novafoods.${{ inputs.app-name }}.desktop "dist/release/$name/"
              fi
              mkdir -p "dist/release/$name/icons"
              cp -R assets/app-icon/hicolor "dist/release/$name/icons/" 2>/dev/null || true
              tar -C dist/release -czf "dist/release/$name.tar.gz" "$name"
              rm -rf "dist/release/$name" /var/tmp/craft-target target
            fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-freebsd-x86_64
          path: dist/release/*
          if-no-files-found: error

