name: "Release"

on:
  workflow_call:
    inputs:
      app-name:
        description: "Application repository name (e.g. novaphoto, novacad)"
        type: string
        required: true
      app-title:
        description: "Application display name (e.g. NovaPhoto, NovaCad)"
        type: string
        required: true
      novafoods-fonts-ref:
        description: "Git ref for EuLucaDev/novafoods-fonts embedded font assets (optional)"
        type: string
        required: false
        default: ""
      web-novafoods-fonts:
        description: "Build the web release with novafoods-fonts too (NOVAFOODS_FONTS_DIR); needs novafoods-fonts-ref. Off by default: each app's build.rs picks which fonts its web build embeds"
        type: boolean
        required: false
        default: false
      version:
        description: "Version override for a test run (empty: read from Cargo.toml)"
        type: string
        required: false
        default: ""
      has-web:
        description: "Whether to build the WebAssembly (wasm) release"
        type: boolean
        required: false
        default: false
      has-riscv64:
        description: "Whether to build the Linux riscv64 release"
        type: boolean
        required: false
        default: false
      has-freebsd:
        description: "Whether to build the FreeBSD release"
        type: boolean
        required: false
        default: false
      has-arch:
        description: "Whether to build the Arch Linux package (.pkg.tar.zst) via makepkg"
        type: boolean
        required: false
        default: false
      wix-version:
        description: "Version of WiX tool to install"
        type: string
        required: false
        default: "5.0.2"
      nfpm-version:
        description: "Version of nfpm tool to install"
        type: string
        required: false
        default: "2.47.0"
      trunk-version:
        description: "Version of trunk tool to install"
        type: string
        required: false
        default: "0.21.14"
      freebsd-release:
        description: "FreeBSD OS version to run in VM"
        type: string
        required: false
        default: "15.1-STABLE"
      has-server:
        description: "Whether to build and release the headless Linux server"
        type: boolean
        required: false
        default: false

    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_CERT_PROFILE:
        required: false

permissions:
  contents: write

jobs:
  version:
    timeout-minutes: 10
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Resolve version
        uses: EuLucaDev/novafoods-actions/actions/resolve-version@v2026.10.18
        with:
          input-version: ${{ inputs.version }}
          app-title: ${{ inputs.app-title }}

  macos:
    timeout-minutes: 90
    name: macOS universal
    needs: version
    runs-on: macos-15
    environment: release
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVACAD_VERSION: ${{ needs.version.outputs.version }}
      NOVACAD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVACAD_BUILD_SHA: ${{ github.sha }}
      NOVAFOODS_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      NOVAFOODS_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFOODS_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      NOVADECK_VERSION: ${{ needs.version.outputs.version }}
      NOVADECK_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADECK_BUILD_SHA: ${{ github.sha }}
      NOVADESIGN_VERSION: ${{ needs.version.outputs.version }}
      NOVADESIGN_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADESIGN_BUILD_SHA: ${{ github.sha }}
      NOVAEFFECT_VERSION: ${{ needs.version.outputs.version }}
      NOVAEFFECT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAEFFECT_BUILD_SHA: ${{ github.sha }}
      NOVAFILM_VERSION: ${{ needs.version.outputs.version }}
      NOVAFILM_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFILM_BUILD_SHA: ${{ github.sha }}
      NOVAGRID_VERSION: ${{ needs.version.outputs.version }}
      NOVAGRID_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAGRID_BUILD_SHA: ${{ github.sha }}
      NOVALIGHT_VERSION: ${{ needs.version.outputs.version }}
      NOVALIGHT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVALIGHT_BUILD_SHA: ${{ github.sha }}
      NOVAPDF_VERSION: ${{ needs.version.outputs.version }}
      NOVAPDF_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPDF_BUILD_SHA: ${{ github.sha }}
      NOVAPHOTO_VERSION: ${{ needs.version.outputs.version }}
      NOVAPHOTO_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPHOTO_BUILD_SHA: ${{ github.sha }}
      NOVASOUND_VERSION: ${{ needs.version.outputs.version }}
      NOVASOUND_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVASOUND_BUILD_SHA: ${{ github.sha }}
      NOVAVECTOR_VERSION: ${{ needs.version.outputs.version }}
      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
      NOVAFIG_VERSION: ${{ needs.version.outputs.version }}
      NOVAFIG_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFIG_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out novafoods-fonts
        if: inputs.novafoods-fonts-ref != ''
        uses: EuLucaDev/novafoods-actions/actions/checkout-novafoods-fonts@v2026.10.18
        with:
          ref: ${{ inputs.novafoods-fonts-ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos-universal
      - name: Install SVG renderer for the Nova Effect disk image
        if: inputs.app-name == 'novaeffect'
        run: cargo install resvg --locked --version 0.48.1
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION"
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOVAFOODS_FONTS_DIR: ${{ github.workspace }}/novafoods-fonts
          NOVAFOODS_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - name: Verify signatures and notarization
        if: hashFiles('packaging/macos/verify.sh') != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/verify.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  windows:
    timeout-minutes: 90
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVACAD_VERSION: ${{ needs.version.outputs.version }}
      NOVACAD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVACAD_BUILD_SHA: ${{ github.sha }}
      NOVAFOODS_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      NOVAFOODS_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFOODS_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      NOVADECK_VERSION: ${{ needs.version.outputs.version }}
      NOVADECK_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADECK_BUILD_SHA: ${{ github.sha }}
      NOVADESIGN_VERSION: ${{ needs.version.outputs.version }}
      NOVADESIGN_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADESIGN_BUILD_SHA: ${{ github.sha }}
      NOVAEFFECT_VERSION: ${{ needs.version.outputs.version }}
      NOVAEFFECT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAEFFECT_BUILD_SHA: ${{ github.sha }}
      NOVAFILM_VERSION: ${{ needs.version.outputs.version }}
      NOVAFILM_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFILM_BUILD_SHA: ${{ github.sha }}
      NOVAGRID_VERSION: ${{ needs.version.outputs.version }}
      NOVAGRID_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAGRID_BUILD_SHA: ${{ github.sha }}
      NOVALIGHT_VERSION: ${{ needs.version.outputs.version }}
      NOVALIGHT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVALIGHT_BUILD_SHA: ${{ github.sha }}
      NOVAPDF_VERSION: ${{ needs.version.outputs.version }}
      NOVAPDF_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPDF_BUILD_SHA: ${{ github.sha }}
      NOVAPHOTO_VERSION: ${{ needs.version.outputs.version }}
      NOVAPHOTO_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPHOTO_BUILD_SHA: ${{ github.sha }}
      NOVASOUND_VERSION: ${{ needs.version.outputs.version }}
      NOVASOUND_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVASOUND_BUILD_SHA: ${{ github.sha }}
      NOVAVECTOR_VERSION: ${{ needs.version.outputs.version }}
      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
      NOVAFIG_VERSION: ${{ needs.version.outputs.version }}
      NOVAFIG_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFIG_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      # See the macOS job: unlisted secrets are empty, and the build would ship unsigned.
      # Signing needs either the PFX pair or all six Azure Trusted Signing values.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out novafoods-fonts
        if: inputs.novafoods-fonts-ref != ''
        uses: EuLucaDev/novafoods-actions/actions/checkout-novafoods-fonts@v2026.10.18
        with:
          ref: ${{ inputs.novafoods-fonts-ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$VERSION"
      - name: Install WiX
        uses: EuLucaDev/novafoods-actions/actions/install-wix@v2026.10.18
        with:
          wix-version: ${{ inputs.wix-version }}
      - name: Build, sign, package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          NOVAFOODS_FONTS_DIR: ${{ github.workspace }}/novafoods-fonts
          NOVAFOODS_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    timeout-minutes: 90
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVACAD_VERSION: ${{ needs.version.outputs.version }}
      NOVACAD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVACAD_BUILD_SHA: ${{ github.sha }}
      NOVAFOODS_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      NOVAFOODS_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFOODS_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      NOVADECK_VERSION: ${{ needs.version.outputs.version }}
      NOVADECK_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADECK_BUILD_SHA: ${{ github.sha }}
      NOVADESIGN_VERSION: ${{ needs.version.outputs.version }}
      NOVADESIGN_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADESIGN_BUILD_SHA: ${{ github.sha }}
      NOVAEFFECT_VERSION: ${{ needs.version.outputs.version }}
      NOVAEFFECT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAEFFECT_BUILD_SHA: ${{ github.sha }}
      NOVAFILM_VERSION: ${{ needs.version.outputs.version }}
      NOVAFILM_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFILM_BUILD_SHA: ${{ github.sha }}
      NOVAGRID_VERSION: ${{ needs.version.outputs.version }}
      NOVAGRID_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAGRID_BUILD_SHA: ${{ github.sha }}
      NOVALIGHT_VERSION: ${{ needs.version.outputs.version }}
      NOVALIGHT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVALIGHT_BUILD_SHA: ${{ github.sha }}
      NOVAPDF_VERSION: ${{ needs.version.outputs.version }}
      NOVAPDF_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPDF_BUILD_SHA: ${{ github.sha }}
      NOVAPHOTO_VERSION: ${{ needs.version.outputs.version }}
      NOVAPHOTO_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPHOTO_BUILD_SHA: ${{ github.sha }}
      NOVASOUND_VERSION: ${{ needs.version.outputs.version }}
      NOVASOUND_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVASOUND_BUILD_SHA: ${{ github.sha }}
      NOVAVECTOR_VERSION: ${{ needs.version.outputs.version }}
      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
      NOVAFIG_VERSION: ${{ needs.version.outputs.version }}
      NOVAFIG_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFIG_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out novafoods-fonts
        if: inputs.novafoods-fonts-ref != ''
        uses: EuLucaDev/novafoods-actions/actions/checkout-novafoods-fonts@v2026.10.18
        with:
          ref: ${{ inputs.novafoods-fonts-ref }}
      - uses: EuLucaDev/novafoods-actions/actions/install-linux-deps@v2026.10.18
        with:
          deb-arch: ${{ matrix.deb }}
          nfpm-version: ${{ inputs.nfpm-version }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          NOVAFOODS_FONTS_DIR: ${{ github.workspace }}/novafoods-fonts
          NOVAFOODS_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb || true
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/|metainfo|applications' || true
          for appimage in dist/release/*.AppImage; do
            if [ -f "$appimage" ]; then
              chmod +x "$appimage"
              APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || true
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  flatpak:
    timeout-minutes: 90
    name: Flatpak ${{ matrix.arch }}
    needs: [version, linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVACAD_VERSION: ${{ needs.version.outputs.version }}
      NOVACAD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVACAD_BUILD_SHA: ${{ github.sha }}
      NOVAFOODS_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      NOVAFOODS_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFOODS_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      NOVADECK_VERSION: ${{ needs.version.outputs.version }}
      NOVADECK_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADECK_BUILD_SHA: ${{ github.sha }}
      NOVADESIGN_VERSION: ${{ needs.version.outputs.version }}
      NOVADESIGN_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVADESIGN_BUILD_SHA: ${{ github.sha }}
      NOVAEFFECT_VERSION: ${{ needs.version.outputs.version }}
      NOVAEFFECT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAEFFECT_BUILD_SHA: ${{ github.sha }}
      NOVAFILM_VERSION: ${{ needs.version.outputs.version }}
      NOVAFILM_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFILM_BUILD_SHA: ${{ github.sha }}
      NOVAGRID_VERSION: ${{ needs.version.outputs.version }}
      NOVAGRID_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAGRID_BUILD_SHA: ${{ github.sha }}
      NOVALIGHT_VERSION: ${{ needs.version.outputs.version }}
      NOVALIGHT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVALIGHT_BUILD_SHA: ${{ github.sha }}
      NOVAPDF_VERSION: ${{ needs.version.outputs.version }}
      NOVAPDF_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPDF_BUILD_SHA: ${{ github.sha }}
      NOVAPHOTO_VERSION: ${{ needs.version.outputs.version }}
      NOVAPHOTO_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAPHOTO_BUILD_SHA: ${{ github.sha }}
      NOVASOUND_VERSION: ${{ needs.version.outputs.version }}
      NOVASOUND_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVASOUND_BUILD_SHA: ${{ github.sha }}
      NOVAVECTOR_VERSION: ${{ needs.version.outputs.version }}
      NOVAVECTOR_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAVECTOR_BUILD_SHA: ${{ github.sha }}
      NOVAWORD_VERSION: ${{ needs.version.outputs.version }}
      NOVAWORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAWORD_BUILD_SHA: ${{ github.sha }}
      NOVAFIG_VERSION: ${{ needs.version.outputs.version }}
      NOVAFIG_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFIG_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        run: |
          tarball=$(find dist/linux -name "*-linux-${{ matrix.arch }}.tar.gz" -print -quit 2>/dev/null)
          packaging/linux/flatpak-bundle.sh "$tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error

  arch:
    name: Arch Linux ${{ matrix.arch }}
    if: inputs.has-arch
    needs: [version, linux]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Find the release tarball
        id: tarball
        run: |
          shopt -s nullglob
          tarballs=(dist/linux/*-linux-${{ matrix.arch }}.tar.gz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one tarball in release-linux-${{ matrix.arch }}, found ${#tarballs[@]}"
            exit 1
          fi
          echo "path=${tarballs[0]}" >>"$GITHUB_OUTPUT"
      - uses: EuLucaDev/novafoods-actions/actions/arch-package@v2026.10.18
        with:
          tarball: ${{ steps.tarball.outputs.path }}
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-arch-${{ matrix.arch }}
          path: dist/release/*.pkg.tar.zst
          if-no-files-found: error

  server:
    timeout-minutes: 90
    name: Server Linux ${{ matrix.arch }}
    if: inputs.has-server
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      NOVAFIG_VERSION: ${{ needs.version.outputs.version }}
      NOVAFIG_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOVAFIG_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-server-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION" || cargo run --locked -q -p xtask -- version set "$VERSION" || true
      - name: Build and package (tar.gz)
        run: packaging/server/package.sh
      - name: Check the archive
        shell: bash
        run: |
          tar -tzf "dist/release/${{ inputs.app-name }}-server-$VERSION-linux-${{ matrix.arch }}.tar.gz" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server-linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  release:
    timeout-minutes: 10
    name: Draft GitHub Release
    if: "!cancelled() && !contains(needs.*.result, 'failure')"
    needs: [version, macos, windows, linux, flatpak, arch, server]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: EuLucaDev/novafoods-actions/actions/draft-release@v2026.10.18
        with:
          version: ${{ needs.version.outputs.version }}
          app-title: ${{ inputs.app-title }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
