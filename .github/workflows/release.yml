    name: Draft GitHub Release
    if: "!cancelled() && !contains(needs.*.result, 'failure')"
    needs: [version, macos, windows, linux, linux-riscv64, flatpak, freebsd, web]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: EuLucaDev/novafoods-actions/actions/draft-release@main
        with:
          version: ${{ needs.version.outputs.version }}
          app-title: ${{ inputs.app-title }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
